<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lindy Tango Brunch</title>
    <style>
      :root {
        --bg: #5d86b5;
        --bg-dark: #324d76;
        --navy: #1f2d48;
        --navy-deep: #2b3d5f;
        --yellow: #f0e7a8;
        --cream: #f3f0d8;
        --skin: #e3c3a7;
        --skin-dark: #ca9f7b;
        --brown: #382e2b;
        --brown-2: #3d2d2a;
        --pink: #f7c9c5;
        --white: #f8f3eb;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        font-family: "Georgia", "Times New Roman", serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: auto;
      }

      .poster {
        position: relative;
        width: min(100vw, 1200px);
        aspect-ratio: 0.82;
        overflow: hidden;
        background: var(--bg);
        color: var(--navy);
      }

      .star {
        position: absolute;
        background: var(--yellow);
        clip-path: polygon(50% 0%, 60% 35%, 100% 50%, 60% 65%, 50% 100%, 40% 65%, 0% 50%, 40% 35%);
        opacity: 0.98;
      }

      .star.top-left {
        width: 54%;
        height: 54%;
        left: -20%;
        top: -16%;
        transform: rotate(-5deg);
      }

      .star.top-center {
        width: 72%;
        height: 72%;
        left: 20%;
        top: -14%;
        transform: rotate(5deg);
      }

      .star.mid-right {
        width: 58%;
        height: 58%;
        right: -20%;
        top: 30%;
        transform: rotate(-8deg);
      }

      .star.bottom-left {
        width: 68%;
        height: 68%;
        left: -25%;
        bottom: -10%;
        transform: rotate(-6deg);
      }

      .star.bottom-right {
        width: 58%;
        height: 58%;
        right: -22%;
        bottom: -10%;
        transform: rotate(5deg);
      }

      .star.small {
        width: 18%;
        height: 18%;
        left: 23%;
        top: 58%;
        transform: rotate(10deg);
        opacity: 0.9;
      }

      .content {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
      }

      .heading {
        position: absolute;
        left: 5%;
        top: 4%;
        font-weight: 700;
        line-height: 0.8;
        color: var(--navy);
        letter-spacing: -0.06em;
        text-transform: none;
      }

      .heading h1 {
        margin: 0;
        font-size: clamp(5.7rem, 9vw, 11rem);
        font-weight: 700;
        font-style: italic;
        line-height: 0.82;
      }

      .heading h1 .second {
        display: block;
      }

      .date-block {
        position: absolute;
        left: 6%;
        top: 42%;
        font-weight: 700;
        color: var(--navy);
        line-height: 0.9;
      }

      .date-block .date {
        font-size: clamp(2.2rem, 4vw, 5rem);
        font-style: italic;
        letter-spacing: -0.05em;
      }

      .date-block .time {
        font-size: clamp(2.2rem, 4vw, 5rem);
        font-style: italic;
        letter-spacing: -0.05em;
      }

      .badge {
        position: absolute;
        right: 6%;
        top: 3%;
        width: clamp(140px, 20vw, 280px);
        height: clamp(140px, 20vw, 280px);
        border: 7px solid var(--navy);
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(255,255,255,0.08);
      }

      .badge::before {
        content: "";
        position: absolute;
        inset: 20% 18% 20% 18%;
        border: 5px solid var(--navy);
        border-radius: 50%;
        opacity: 0.8;
      }

      .badge .plan {
        position: relative;
        z-index: 1;
        font-size: clamp(2.2rem, 3vw, 4rem);
        font-style: italic;
        font-weight: 700;
        color: var(--navy);
      }

      .music {
        position: absolute;
        display: block;
        color: var(--navy);
        font-size: clamp(2.2rem, 4vw, 5rem);
        font-weight: 700;
        transform: rotate(15deg);
      }

      .music.m1 { left: 40%; top: 15%; }
      .music.m2 { left: 74%; top: 49%; }
      .music.m3 { left: 77%; top: 72%; }
      .music.m4 { left: 28%; top: 76%; }
      .music.m5 { left: 13%; top: 54%; }
      .music.m6 { left: 60%; bottom: 2%; }
      .music.m7 { right: 7%; top: 23%; }
      .music.m8 { left: 58%; top: 48%; }
      .music.m9 { right: 22%; bottom: 17%; }
      .music.m10 { left: 72%; top: 16%; }

      .music::before {
        content: "♪";
      }

      .dancer {
        position: absolute;
        width: 260px;
        height: 360px;
      }

      .dancer .head {
        position: absolute;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: var(--skin);
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
      }

      .dancer .body {
        position: absolute;
        width: 120px;
        height: 150px;
        left: 50%;
        top: 68px;
        transform: translateX(-50%);
        border-radius: 28px 28px 16px 16px;
        background: var(--navy);
      }

      .dancer .arm { position: absolute; width: 110px; height: 26px; border-radius: 16px; background: var(--skin); }
      .dancer .arm.left { left: 20px; top: 120px; transform: rotate(18deg); }
      .dancer .arm.right { right: 20px; top: 104px; transform: rotate(-30deg); }
      .dancer .leg { position: absolute; width: 32px; height: 120px; border-radius: 16px; background: var(--brown); }
      .dancer .leg.left { left: 97px; top: 210px; transform: rotate(16deg); }
      .dancer .leg.right { right: 95px; top: 208px; transform: rotate(-18deg); }

      .dancer.dark .body { background: #2d2d38; }
      .dancer.dark .leg { background: #3a2f2f; }
      .dancer.dark .arm { background: #d09074; }
      .dancer.light .body { background: #f4f0eb; }
      .dancer.light .leg { background: #ece2d8; }
      .dancer.light .arm { background: #f4d7b9; }

      .dancer.pair-one { left: 18%; top: 14%; transform: rotate(-9deg); }
      .dancer.pair-two { left: 45%; top: 5%; transform: rotate(7deg); }
      .dancer.pair-three { left: 12%; top: 45%; transform: rotate(3deg); }
      .dancer.pair-four { left: 50%; top: 42%; transform: rotate(-8deg); }
      .dancer.pair-five { left: 46%; top: 62%; transform: rotate(12deg); }
      .dancer.pair-six { left: 18%; top: 62%; transform: rotate(-16deg); }

      .dancer .head.skin-1 { background: #e7c8a2; }
      .dancer .head.skin-2 { background: #c38959; }
      .dancer .head.skin-3 { background: #ecb695; }
      .dancer .head.skin-4 { background: #a36d49; }

      .dancer .hair {
        position: absolute;
        width: 66px;
        height: 42px;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        background: #1b1c2b;
        border-radius: 50% 50% 42% 42%;
      }

      .dancer .hair.h2 { background: #5a3e2d; }
      .dancer .hair.h3 { background: #caa892; }

      .dancer .arm.arm-left-swing { left: 10px; top: 110px; transform: rotate(60deg); }
      .dancer .arm.arm-right-swing { right: -2px; top: 122px; transform: rotate(-62deg); }
      .dancer .arm.arm-left-bent { left: 10px; top: 115px; transform: rotate(35deg); }
      .dancer .arm.arm-right-bent { right: 18px; top: 120px; transform: rotate(-48deg); }
      .dancer .leg.leg-right-up { right: 104px; top: 206px; transform: rotate(-50deg); }
      .dancer .leg.leg-left-up { left: 104px; top: 214px; transform: rotate(55deg); }

      .note-1,
      .note-2,
      .note-3 {
        position: absolute;
        width: 20px;
        height: 60px;
        border-radius: 12px 12px 8px 8px;
        background: var(--navy);
      }

      .note-1::before,
      .note-2::before,
      .note-3::before {
        content: "";
        position: absolute;
        width: 12px;
        height: 20px;
        border-radius: 50%;
        background: var(--navy);
        right: -8px;
        top: 21px;
      }

      .note-1::after,
      .note-2::after,
      .note-3::after {
        content: "";
        position: absolute;
        width: 3px;
        height: 25px;
        background: var(--navy);
        left: 4px;
        top: 22px;
        border-radius: 10px;
      }

      .note-1 { left: 50%; top: 38%; }
      .note-2 { left: 63%; top: 32%; }
      .note-3 { left: 68%; top: 58%; }

      .food {
        position: absolute;
        width: 180px;
        height: 140px;
        left: 25%;
        top: 40%;
      }

      .food .food-item {
        position: absolute;
        width: 22px;
        height: 22px;
        border-radius: 50%;
      }

      .food .red { background: #d9534f; left: 40px; top: 48px; }
      .food .green { background: #7dbd72; left: 65px; top: 62px; }
      .food .orange { background: #e4a434; left: 86px; top: 38px; }
      .food .purple { background: #8f7ecf; left: 108px; top: 52px; }
      .food .eggplant { background: #6c5a9d; left: 132px; top: 80px; }
      .food .pan {
        position: absolute;
        width: 110px;
        height: 70px;
        left: 18px;
        top: 24px;
        border-radius: 50% 50% 56% 56%;
        background: #f2f6f9;
        border: 6px solid var(--navy);
        transform: rotate(-18deg);
      }

      .info-box {
        position: absolute;
        left: 4%;
        bottom: 5%;
        color: var(--navy);
        font-style: italic;
        font-weight: 700;
        line-height: 0.85;
      }

      .info-box .entry {
        font-size: clamp(3rem, 5vw, 7rem);
      }

      .info-box .handle {
        font-size: clamp(2.4rem, 4vw, 5rem);
        display: block;
        margin-top: 1.2rem;
      }

      .info-box .location {
        display: block;
        margin-top: 0.7rem;
        font-size: clamp(2rem, 4vw, 5rem);
        letter-spacing: -0.05em;
      }

      @media (max-width: 900px) {
        .poster {
          width: 100vw;
          min-height: 100vh;
          aspect-ratio: auto;
        }

        .heading { left: 6%; top: 5%; }
        .badge { right: 5%; top: 2%; }
        .date-block { left: 5%; top: 33%; }
        .dancer { transform: scale(0.75) !important; }
      }
    </style>
  </head>
  <body>
    <main class="poster" aria-label="Lindy Tango Brunch flyer">
      <div class="star top-left"></div>
      <div class="star top-center"></div>
      <div class="star mid-right"></div>
      <div class="star bottom-left"></div>
      <div class="star bottom-right"></div>
      <div class="star small"></div>

      <div class="content">
        <header class="heading">
          <h1>
            Lindy
            <span class="second">Tango</span>
            <span class="second">Brunch</span>
          </h1>
        </header>

        <div class="badge"><span class="plan">plan</span></div>

        <div class="date-block">
          <div class="date">1.11.2026</div>
          <div class="time">11–15h</div>
        </div>

        <div class="music m1"></div>
        <div class="music m2"></div>
        <div class="music m3"></div>
        <div class="music m4"></div>
        <div class="music m5"></div>
        <div class="music m6"></div>
        <div class="music m7"></div>
        <div class="music m8"></div>
        <div class="music m9"></div>
        <div class="music m10"></div>

        <div class="dancer pair-one dark">
          <div class="hair"></div>
          <div class="head skin-1"></div>
          <div class="body"></div>
          <div class="arm arm-left-swing"></div>
          <div class="arm arm-right-swing"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>

        <div class="dancer pair-two light">
          <div class="hair h2"></div>
          <div class="head skin-2"></div>
          <div class="body"></div>
          <div class="arm arm-left-bent"></div>
          <div class="arm arm-right-bent"></div>
          <div class="leg leg-left-up"></div>
          <div class="leg leg-right-up"></div>
        </div>

        <div class="dancer pair-three dark">
          <div class="hair h3"></div>
          <div class="head skin-3"></div>
          <div class="body"></div>
          <div class="arm arm-left-bent"></div>
          <div class="arm arm-right-bent"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>

        <div class="dancer pair-four light">
          <div class="hair"></div>
          <div class="head skin-4"></div>
          <div class="body"></div>
          <div class="arm arm-left-bent"></div>
          <div class="arm arm-right-bent"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>

        <div class="dancer pair-five dark">
          <div class="hair h2"></div>
          <div class="head skin-1"></div>
          <div class="body"></div>
          <div class="arm arm-left-swing"></div>
          <div class="arm arm-right-swing"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>

        <div class="dancer pair-six light">
          <div class="hair"></div>
          <div class="head skin-3"></div>
          <div class="body"></div>
          <div class="arm arm-left-bent"></div>
          <div class="arm arm-right-bent"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>

        <div class="food" aria-hidden="true">
          <div class="pan"></div>
          <div class="food-item red"></div>
          <div class="food-item green"></div>
          <div class="food-item orange"></div>
          <div class="food-item purple"></div>
          <div class="food-item eggplant"></div>
        </div>

        <div class="info-box">
          <div class="entry">Entry: 10–20CHF</div>
          <span class="handle">@Caminto</span>
          <span class="location">Gundeldingerfeld, Basel</span>
        </div>
      </div>
    </main>
  </body>
</html>
