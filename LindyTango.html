<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lindy Tango Brunch</title>
    <style>
      :root {
        --bg: #5d86b5;
        --panel: rgba(255, 255, 255, 0.1);
        --panel-border: rgba(255, 255, 255, 0.15);
        --text: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .gallery-shell {
        width: min(100%, 1280px);
      }

      .viewer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .gallery {
        display: flex;
        gap: 18px;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
        width: min(76vw, 720px);
        padding: 12px 0;
      }

      .gallery::-webkit-scrollbar {
        display: none;
      }

      .slide {
        flex: 0 0 100%;
        width: 100%;
        scroll-snap-align: start;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        padding: 12px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
      }

      .slide img {
        display: block;
        width: 100%;
        height: auto;
        max-height: calc(100vh - 180px);
        object-fit: contain;
        border-radius: 12px;
        background: #dfeaf8;
      }

      .controls {
        display: flex;
        justify-content: center;
        margin-top: 14px;
        gap: 10px;
      }

      .controls button {
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.08);
        color: var(--text);
        border-radius: 999px;
        padding: 10px 18px;
        cursor: pointer;
        font-size: 0.95rem;
      }

      .controls button:hover {
        background: rgba(255,255,255,0.15);
      }

      .nav-button {
        flex-shrink: 0;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.08);
        color: var(--text);
        font-size: 1.7rem;
        cursor: pointer;
      }

      .nav-button:hover {
        background: rgba(255,255,255,0.15);
      }
    </style>
  </head>
  <body>
    <div class="gallery-shell">
      <div class="viewer">
        <button type="button" class="nav-button" id="prevBtn" aria-label="Previous image">←</button>

        <div class="gallery" id="gallery" aria-label="Image gallery">
          <div class="slide"><img src="assets/images/LTB/LTB.jpg" alt="Lindy Tango Brunch flyer" /></div>
          <div class="slide"><img src="assets/images/LTB/LTB.jpg" alt="Lindy Tango Brunch flyer alternate" /></div>
          <div class="slide"><img src="assets/images/LTB/LTB.jpg" alt="Lindy Tango Brunch flyer alternate 2" /></div>
        </div>

        <button type="button" class="nav-button" id="nextBtn" aria-label="Next image">→</button>
      </div>
    </div>

    <script>
      const gallery = document.getElementById('gallery');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      const images = [
        'assets/images/LTB/LTB.jpg',
        'assets/images/LTB/LTB.jpg',
        'assets/images/LTB/LTB.jpg'
      ];

      // Easy to extend: just add more image paths here.
      // Example:
      // const images = [
      //   'assets/images/LTB/LTB.jpg',
      //   'assets/images/other/slide-2.jpg',
      //   'assets/images/other/slide-3.jpg'
      // ];

      const buildSlides = () => {
        gallery.innerHTML = '';

        images.forEach((src, index) => {
          const slide = document.createElement('div');
          slide.className = 'slide';

          const img = document.createElement('img');
          img.src = src;
          img.alt = 'Flyer slide ' + (index + 1);
          slide.appendChild(img);
          gallery.appendChild(slide);
        });
      };

      const scrollBySlide = (direction) => {
        const slideWidth = gallery.querySelector('.slide')?.getBoundingClientRect().width || 720;
        gallery.scrollBy({ left: direction * (slideWidth + 18), behavior: 'smooth' });
      };

      prevBtn.addEventListener('click', () => scrollBySlide(-1));
      nextBtn.addEventListener('click', () => scrollBySlide(1));

      buildSlides();
    </script>
  </body>
</html>
